  return "bon";
}
function statusMeta(key) {
  return {
    bon: { label: "Bon", cls: "st-bon" },
    moyen: { label: "Moyen", cls: "st-moyen" },
    mauvais: { label: "Mauvais", cls: "st-mauvais" },
    incomplet: { label: "À compléter", cls: "st-incomplet" }
  }[key] || { label: key, cls: "st-incomplet" };
}
function sortedChantiers() {
  return STATE.chantiers.slice().sort(function (a, b) {
    return (b.dateVisite || "").localeCompare(a.dateVisite || "") ||
      (b.updatedAt || "").localeCompare(a.updatedAt || "");
  });
}
function findChantier(id) {
  for (var i = 0; i < STATE.chantiers.length; i++) if (STATE.chantiers[i].id === id) return STATE.chantiers[i];
  return null;
}
function shortLabel(defKey) { return defKey === "securite" ? "Sécu" : defKey === "organisation" ? "Org." : SECTIONS[defKey].title; }

/* ---------- Stockage local ---------- */
function loadLocal() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    var parsed = JSON.parse(raw);
    return parsed && Array.isArray(parsed.chantiers) ? parsed.chantiers : null;
  } catch (e) { storageOk = false; return null; }
}
function saveLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ chantiers: STATE.chantiers }));
    storageOk = true;
    return true;
  } catch (e) {
    storageOk = false;
    return false;
  }
}
/* Fusion par identifiant : la fiche la plus récemment modifiée l'emporte. */
function mergeChantiers(incoming) {
  var added = 0, updated = 0;
  (incoming || []).forEach(function (rec) {
    if (!rec || !rec.id) return;
    rec = normalizeRecord(rec);
    var cur = findChantier(rec.id);
    if (!cur) { STATE.chantiers.push(rec); added++; }
    else if ((rec.updatedAt || "") > (cur.updatedAt || "")) {
      STATE.chantiers[STATE.chantiers.indexOf(cur)] = rec; updated++;
    }
  });
  return { added: added, updated: updated };
}

/* ---------- Téléchargements ---------- */
function download(filename, content, mime) {
  var blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}
function safeFilename(s) {
  return String(s || "chantier").normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9-_ ]/g, "").trim().replace(/\s+/g, "-").slice(0, 60) || "chantier";
}

var PDF_LIBS = [
  "https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js",
  "https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"
];
var pdfLibPromise = null;
function loadScriptOnce(src) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    s.src = src; s.async = false;
    s.onload = function () { resolve(); };
    s.onerror = function () { reject(new Error("load " + src)); };
    document.head.appendChild(s);
  });
}
function ensurePdfLib() {
  if (window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable) return Promise.resolve(window.jspdf.jsPDF);
  if (!pdfLibPromise) {
    pdfLibPromise = loadScriptOnce(PDF_LIBS[0])
      .then(function () { return loadScriptOnce(PDF_LIBS[1]); })
      .then(function () {
        if (!window.jspdf || !window.jspdf.jsPDF || !window.jspdf.jsPDF.API.autoTable) throw new Error("lib");
        return window.jspdf.jsPDF;
      })
      .catch(function (err) { pdfLibPromise = null; throw err; });
  }
  return pdfLibPromise;
}

/* Charte ATTILA (06/10/2026). Police : Helvetica, seule police standard du PDF
   (Tahoma ne peut pas être embarquée ici). */
var PDF_C = {
  rouge: [183, 14, 12], gris: [88, 102, 109], creme: [254, 244, 236], noir: [0, 0, 0], blanc: [255, 255, 255],
  trait: [235, 221, 210]
};
var PDF_ST = {
  bon: { fg: [46, 125, 70], bg: [227, 242, 231] },
  moyen: { fg: [150, 98, 6], bg: [251, 240, 218] },
  mauvais: { fg: [183, 14, 12], bg: [247, 224, 223] },
  incomplet: { fg: [88, 102, 109], bg: [238, 240, 241] }
};
function pdfText(s) {
  return String(s == null ? "" : s)
    .replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
    .replace(/[–—]/g, "-").replace(/…/g, "...").replace(/ | /g, " ")
    .replace(/œ/g, "oe").replace(/Œ/g, "OE")
    .replace(/[^\x00-\xFF]/g, "");
}
function pdfStamp() {
  var d = new Date();
  return fmtDate(todayISOLocal(d)) + " à " + String(d.getHours()).padStart(2, "0") + "h" + String(d.getMinutes()).padStart(2, "0");
}
function todayISOLocal(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function pdfHeader(doc, subtitle) {
  var W = doc.internal.pageSize.getWidth();
  doc.addImage(LOGO_COULEUR, "PNG", 14, 10, 52, 52 * 110 / 480);
  doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor.apply(doc, PDF_C.rouge);
  doc.text("FICHE DE VISITE CHANTIER", W - 14, 16, { align: "right" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor.apply(doc, PDF_C.gris);
  doc.text(pdfText(subtitle), W - 14, 21.5, { align: "right" });
  doc.setDrawColor.apply(doc, PDF_C.rouge); doc.setLineWidth(0.8);
  doc.line(14, 27, W - 14, 27);
  return 35;
}
function pdfFooters(doc) {
  var n = doc.getNumberOfPages();
  var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  for (var i = 1; i <= n; i++) {
    doc.setPage(i);
    doc.setDrawColor.apply(doc, PDF_C.trait); doc.setLineWidth(0.3);
    doc.line(14, H - 12, W - 14, H - 12);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor.apply(doc, PDF_C.gris);
    doc.text("ATTILA - Document interne - Édité le " + pdfStamp(), 14, H - 7.5);
    doc.text("Page " + i + " / " + n, W - 14, H - 7.5, { align: "right" });
  }
}
function pdfStatusCell(data, key) {
  var st = PDF_ST[key] || PDF_ST.incomplet;
  data.cell.styles.fillColor = st.bg;
  data.cell.styles.textColor = st.fg;
  data.cell.styles.fontStyle = "bold";
}
function pdfSectionTitle(doc, y, title) {
  var H = doc.internal.pageSize.getHeight();
  if (y > H - 40) { doc.addPage(); y = 20; }
  doc.setFont("helvetica", "bold"); doc.setFontSize(11.5); doc.setTextColor.apply(doc, PDF_C.rouge);
  doc.text(pdfText(title), 14, y);
  return y + 3;
}
var PDF_DISCLAIMER = "Les statuts Sécurité et Organisation sont calculés automatiquement : l'item le plus défavorable détermine le statut de la section ; une section dont un item n'est pas évalué est « à compléter ». Cette fiche ne remplace pas le document unique d'évaluation des risques ni les obligations réglementaires de l'agence : en cas d'écart constaté, appliquer la procédure sécurité en vigueur.";

function buildFichePDF(jsPDF, rec, sections, sectionKeys) {
  var doc = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
  doc.setProperties({ title: pdfText("Fiche de visite chantier - " + (rec.client || "")), author: "ATTILA", creator: "Fiche de visite chantier ATTILA" });
  var W = doc.internal.pageSize.getWidth();
  var y = pdfHeader(doc, "Visite du " + fmtDate(rec.dateVisite));

  doc.setFont("helvetica", "bold"); doc.setFontSize(17); doc.setTextColor.apply(doc, PDF_C.noir);
  var titleLines = doc.splitTextToSize(pdfText(rec.client || "(client non renseigné)"), W - 28);
  doc.text(titleLines, 14, y + 2);
  y += 2 + titleLines.length * 7;

  doc.autoTable({
    startY: y,
    theme: "plain",
    margin: { left: 14, right: 14 },
    styles: { font: "helvetica", fontSize: 9.5, cellPadding: { top: 1.8, bottom: 1.8, left: 3, right: 3 }, textColor: PDF_C.noir },
    columnStyles: { 0: { cellWidth: 38, fontStyle: "bold", textColor: PDF_C.gris }, 2: { cellWidth: 33, fontStyle: "bold", textColor: PDF_C.gris } },
    body: [
      ["Adresse", pdfText(rec.adresse || "-"), "Date de la visite", fmtDate(rec.dateVisite)],
      ["TTA référent", pdfText(rec.ttaReferent || "-"), "Type de toiture", pdfText(rec.typeToiture || "-")],
      ["Autres TTA présents", { content: pdfText(rec.autresTta || "-"), colSpan: 3 }]
    ],
    didParseCell: function (data) { data.cell.styles.fillColor = PDF_C.creme; }
  });
  y = doc.lastAutoTable.finalY + 8;

  y = pdfSectionTitle(doc, y, "Synthèse");
  doc.autoTable({
    startY: y + 1,
    theme: "grid",
    margin: { left: 14, right: 14 },
    styles: { font: "helvetica", fontSize: 10, halign: "center", cellPadding: 3, lineColor: PDF_C.blanc, lineWidth: 0.8 },
    headStyles: { fillColor: PDF_C.gris, textColor: PDF_C.blanc, fontStyle: "bold" },
    head: [sectionKeys.map(function (k) { return pdfText(sections[k].title); })],
    body: [sectionKeys.map(function (k) { return statusMeta(computeSectionStatus(rec[k], k)).label; })],
    didParseCell: function (data) {
      if (data.section === "body") pdfStatusCell(data, computeSectionStatus(rec[sectionKeys[data.column.index]], sectionKeys[data.column.index]));
    }
  });
  y = doc.lastAutoTable.finalY + 9;

  sectionKeys.forEach(function (k) {
    y = pdfSectionTitle(doc, y, sections[k].title);
    var body = sections[k].items.map(function (it) {
      var cell = rec[k][it.key] || { etat: null, commentaire: "" };
      return [pdfText(it.label), cell.etat ? statusMeta(cell.etat).label : "Non évalué", pdfText(cell.commentaire || "")];
    });
    doc.autoTable({
      startY: y + 1,
      theme: "grid",
      margin: { left: 14, right: 14 },
      styles: { font: "helvetica", fontSize: 9.5, cellPadding: 2.6, lineColor: PDF_C.trait, lineWidth: 0.25, textColor: PDF_C.noir, valign: "middle" },
      headStyles: { fillColor: PDF_C.rouge, textColor: PDF_C.blanc, fontStyle: "bold" },
      columnStyles: { 0: { cellWidth: 72 }, 1: { cellWidth: 28, halign: "center" } },
      head: [["Point contrôlé", "État", "Commentaire"]],
      body: body,
      didParseCell: function (data) {
        if (data.section === "body" && data.column.index === 1) {
          var item = sections[k].items[data.row.index];
          var e = rec[k][item.key] ? rec[k][item.key].etat : null;
          pdfStatusCell(data, e || "incomplet");
        }
      }
    });
    y = doc.lastAutoTable.finalY + 9;
  });

  var H = doc.internal.pageSize.getHeight();
  doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor.apply(doc, PDF_C.gris);
  var lines = doc.splitTextToSize(pdfText(PDF_DISCLAIMER), W - 28);
  if (y + lines.length * 3.4 > H - 16) { doc.addPage(); y = 20; }
  doc.text(lines, 14, y);

  pdfFooters(doc);
  return doc;
}

function buildRecapPDF(jsPDF, list, sections, sectionKeys) {
  var doc = new jsPDF({ unit: "mm", format: "a4", orientation: "landscape" });
  doc.setProperties({ title: "Récapitulatif des chantiers ATTILA", author: "ATTILA", creator: "Fiche de visite chantier ATTILA" });
  var y = pdfHeader(doc, "Récapitulatif - " + list.length + " chantier" + (list.length > 1 ? "s" : ""));
  doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.setTextColor.apply(doc, PDF_C.noir);
  doc.text("Récapitulatif des chantiers visités", 14, y + 1);
  y += 6;
  var head = ["Client", "Adresse", "Date visite", "TTA référent", "Autres TTA", "Type toiture"];
  sectionKeys.forEach(function (k) { head.push(pdfText(sections[k].title)); });
  head.push("Mise à jour");
  var body = list.map(function (rec) {
    var r = [pdfText(rec.client), pdfText(rec.adresse), fmtDate(rec.dateVisite), pdfText(rec.ttaReferent), pdfText(rec.autresTta), pdfText(rec.typeToiture)];
    sectionKeys.forEach(function (k) { r.push(statusMeta(computeSectionStatus(rec[k], k)).label); });
    r.push(fmtDate((rec.updatedAt || "").slice(0, 10)));
    return r;
  });
  if (!body.length) body = [[{ content: "Aucun chantier enregistré.", colSpan: head.length, styles: { halign: "center", textColor: PDF_C.gris } }]];
  doc.autoTable({
    startY: y,
    theme: "grid",
    margin: { left: 14, right: 14, bottom: 16 },
    styles: { font: "helvetica", fontSize: 8.5, cellPadding: 2.2, lineColor: PDF_C.trait, lineWidth: 0.25, textColor: PDF_C.noir, valign: "middle" },
    headStyles: { fillColor: PDF_C.rouge, textColor: PDF_C.blanc, fontStyle: "bold" },
    alternateRowStyles: { fillColor: PDF_C.creme },
    columnStyles: { 2: { cellWidth: 21 }, 6: { halign: "center", cellWidth: 24 }, 7: { halign: "center", cellWidth: 26 }, 8: { cellWidth: 21 } },
    head: [head],
    body: body,
    didParseCell: function (data) {
      if (data.section !== "body" || !list.length) return;
      var idx = data.column.index - 6;
      if (idx >= 0 && idx < sectionKeys.length) {
        var rec = list[data.row.index];
        pdfStatusCell(data, computeSectionStatus(rec[sectionKeys[idx]], sectionKeys[idx]));
      }
    }
  });
  pdfFooters(doc);
  return doc;
}

var pdfBusy = false;
function exportPDF(kind, arg) {
  if (pdfBusy) return;
  pdfBusy = true;
  ensurePdfLib().then(function (jsPDF) {
    if (kind === "fiche") {
      download("visite-" + safeFilename(arg.client) + "-" + arg.dateVisite + ".pdf",
        buildFichePDF(jsPDF, arg, SECTIONS, SECTION_KEYS).output("blob"));
    } else {
      download("recapitulatif-chantiers-attila-" + todayISOLocal() + ".pdf",
        buildRecapPDF(jsPDF, arg, SECTIONS, SECTION_KEYS).output("blob"));
    }
  }).catch(function () {
    notice = { type: "error", text: "Le générateur PDF n'a pas pu être chargé. Vérifiez la connexion internet puis réessayez." };
    render();
  }).then(function () { pdfBusy = false; });
}

    "<p>Visite du " + fmtDate(rec.dateVisite) + "</p></div>" +
    '<div class="btnrow"><button type="button" class="btn" data-export-fiche="' + rec.id + '">Exporter en PDF</button>' +
    '<button type="button" class="btn btn-primary" data-edit="' + rec.id + '">Modifier</button></div></div>' +
    '<div class="card"><h2>Chantier</h2><dl class="detailgrid">' +
    dfield("Client", rec.client) + dfield("Adresse", rec.adresse) + dfield("Date de la visite", fmtDate(rec.dateVisite)) +
    dfield("TTA référent", rec.ttaReferent) + dfield("Autres TTA présents", rec.autresTta) +
    dfield("Type de toiture", rec.typeToiture) +
    "</dl></div>" +
    SECTION_KEYS.map(sectionDetail).join("") +
    '<div class="btnrow" style="margin-top:1.1rem;"><button type="button" class="btn btn-ghost" data-nav="liste">← Retour à la liste</button></div>';
  return shellHtml(html);
}

function renderRecap() {
  var list = sortedChantiers();
  var rows = list.map(function (rec) {
    var cells = SECTION_KEYS.map(function (k) {
      var s = statusMeta(computeSectionStatus(rec[k], k));
      return '<td><span class="pill-status ' + s.cls + '">' + s.label + "</span></td>";
    }).join("");
    return '<tr data-open="' + rec.id + '"><td>' + escapeHtml(rec.client) + "</td><td>" + escapeHtml(rec.adresse) +
      '</td><td class="num">' + fmtDate(rec.dateVisite) + "</td><td>" + escapeHtml(rec.ttaReferent) +
      "</td><td>" + escapeHtml(rec.autresTta) + "</td><td>" + escapeHtml(rec.typeToiture) + "</td>" + cells +
      '<td class="num">' + fmtDate((rec.updatedAt || "").slice(0, 10)) + "</td></tr>";
  }).join("");
  var heads = SECTION_KEYS.map(function (k) { return "<th>Statut " + escapeHtml(SECTIONS[k].title.toLowerCase()) + "</th>"; }).join("");
  var table = list.length
    ? '<div class="tablewrap"><table class="recap"><thead><tr><th>Client</th><th>Adresse</th><th>Date visite</th>' +
      "<th>TTA référent</th><th>Autres TTA</th><th>Type toiture</th>" + heads +
      "<th>Maj</th></tr></thead><tbody>" + rows + "</tbody></table></div>"
    : '<div class="empty">Aucun chantier à récapituler.</div>';
  return shellHtml('<div class="pagehead"><div><h1>Récapitulatif des chantiers</h1><p>Toutes les fiches présentes sur cet appareil</p></div>' +
    '<div class="btnrow">' +
    '<button type="button" class="btn" data-export-recap="1">Exporter le récapitulatif en PDF</button>' +
    '<button type="button" class="btn" data-export-json="1">Exporter les fiches (JSON)</button>' +
    '<label class="btn" for="import-json">Importer des fiches (JSON)</label>' +
    '<input type="file" id="import-json" accept="application/json,.json" hidden>' +
    "</div></div>" + table);
}

function render() {
  var html;
  if (view === "form") html = renderForm();
  else if (view === "detail") html = renderDetail();
  else if (view === "recap") html = renderRecap();
  else html = renderListe();
  document.getElementById("app").innerHTML = html;
  notice = null;
}

/* ---------- Formulaire ---------- */
function validateForm(formEl) {
  var ok = true;
  ["client", "adresse", "dateVisite", "ttaReferent", "typeToiture"].forEach(function (name) {
    var input = formEl.querySelector('[name="' + name + '"]');
    var fieldEl = formEl.querySelector('[data-field="' + name + '"]');
    var valid = input.value != null && String(input.value).trim() !== "";
    fieldEl.classList.toggle("invalid", !valid);
    if (!valid) ok = false;
  });
  return ok;
}

/* ---------- Écouteurs ---------- */
document.addEventListener("click", function (e) {
  var navEl = e.target.closest("[data-nav]");
  if (navEl) {
    var nav = navEl.getAttribute("data-nav");
    if (nav === "form-new") { draft = blankRecord(); editingId = null; view = "form"; }
    else if (nav.indexOf("detail|") === 0) { editingId = nav.split("|")[1]; view = "detail"; }
    else { view = nav; }
    render(); window.scrollTo(0, 0);
    return;
  }
  var openEl = e.target.closest("[data-open]");
  if (openEl) { editingId = openEl.getAttribute("data-open"); view = "detail"; render(); window.scrollTo(0, 0); return; }

  var editEl = e.target.closest("[data-edit]");
  if (editEl) {
    var rec0 = findChantier(editEl.getAttribute("data-edit"));
    if (rec0) { draft = JSON.parse(JSON.stringify(rec0)); editingId = rec0.id; view = "form"; render(); window.scrollTo(0, 0); }
    return;
  }

  var pillEl = e.target.closest("[data-pill]");
  if (pillEl) {
    var parts = pillEl.getAttribute("data-pill").split("|");
    var secKey = parts[0], itemKey = parts[1], stateKey = parts[2];
    var cur = draft[secKey][itemKey].etat;
    draft[secKey][itemKey].etat = (cur === stateKey) ? null : stateKey;
    var group = pillEl.closest(".evalitem-pills");
    group.querySelectorAll(".pill").forEach(function (p) { p.classList.remove("active"); });
    if (draft[secKey][itemKey].etat) pillEl.classList.add("active");
    var badge = pillEl.closest(".card").querySelector(".sectionstatus .pill-status");
    var st = statusMeta(computeSectionStatus(draft[secKey], secKey));
    badge.className = "pill-status " + st.cls;
    badge.textContent = st.label;
    return;
  }

  var expFiche = e.target.closest("[data-export-fiche]");
  if (expFiche) {
    var recF = findChantier(expFiche.getAttribute("data-export-fiche"));
    if (recF) exportPDF("fiche", recF);
    return;
  }
  if (e.target.closest("[data-export-recap]")) {
    exportPDF("recap", sortedChantiers());
    return;
  }
  if (e.target.closest("[data-export-json]")) {
    var payload = { export: "fiches-visite-chantier-attila", exporteLe: new Date().toISOString(), chantiers: sortedChantiers() };
    download("fiches-visite-" + todayISO() + ".json", JSON.stringify(payload, null, 2), "application/json");
    return;
  }
}, false);

document.addEventListener("change", function (e) {
  if (e.target.id !== "import-json" || !e.target.files || !e.target.files[0]) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var parsed = JSON.parse(reader.result);
      var list = Array.isArray(parsed) ? parsed : parsed.chantiers;
      if (!Array.isArray(list)) throw new Error("format");
      var res = mergeChantiers(list);
      saveLocal();
      notice = { type: "info", text: "Import terminé : " + res.added + " fiche(s) ajoutée(s), " + res.updated + " mise(s) à jour." };
    } catch (err) {
      notice = { type: "error", text: "Ce fichier n’est pas un export de fiches valide. Utilisez un fichier produit par « Exporter les fiches (JSON) » ou le fichier data.json." };
    }
    render();
  };
  reader.readAsText(e.target.files[0]);
}, false);

document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.matches(".evalitem-comment")) {
    var parts = t.getAttribute("data-comment").split("|");
    draft[parts[0]][parts[1]].commentaire = t.value;
  }
}, false);

document.addEventListener("submit", function (e) {
  var form = e.target.closest("#chantier-form");
  if (!form) return;
  e.preventDefault();
  if (!validateForm(form)) { var bad = form.querySelector(".invalid input"); if (bad) bad.focus(); return; }
  var fd = new FormData(form);
  ["client", "adresse", "dateVisite", "ttaReferent", "autresTta", "typeToiture"].forEach(function (name) {
    draft[name] = fd.get(name) || "";
  });
  draft.updatedAt = new Date().toISOString();
  var existing = findChantier(draft.id);
  if (existing) STATE.chantiers[STATE.chantiers.indexOf(existing)] = draft;
  else STATE.chantiers.push(draft);
  if (!saveLocal()) notice = { type: "error", text: "Fiche gardée en mémoire, mais l’enregistrement sur l’appareil a échoué. Exportez vos fiches avant de fermer la page." };
  editingId = draft.id;
  view = "detail";
  draft = null;
  render(); window.scrollTo(0, 0);
}, false);

/* ---------- Démarrage ---------- */
function applyConfig(cfg) {
  if (cfg && cfg.sections && typeof cfg.sections === "object") { SECTIONS = cfg.sections; SECTION_KEYS = Object.keys(SECTIONS); }
  if (cfg && Array.isArray(cfg.typesToiture)) TYPES_TOITURE = cfg.typesToiture;
}
function start(cfg) {
  applyConfig(cfg);
  var local = loadLocal();
  STATE.chantiers = (local || []).map(normalizeRecord);
  var seeded = mergeChantiers(cfg && cfg.chantiers);
  if (seeded.added || seeded.updated || !local) saveLocal();
  render();
}

fetch("data.json", { cache: "no-cache" })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(start)
  .catch(function () { configSource = "defaut"; start(DEFAULT_CONFIG); });

})();
</script>
</body>
</html>
